CONFIG_GPIO=y
CONFIG_I2C=y

# RTT logging
CONFIG_UART_CONSOLE=n
CONFIG_RTT_CONSOLE=y
CONFIG_CONSOLE=y
CONFIG_LOG=y
CONFIG_USE_SEGGER_RTT=y
CONFIG_LOG_BACKEND_RTT=y
CONFIG_SEGGER_RTT_INIT_MODE_ALWAYS=y
# CONFIG_PRINTK=y

CONFIG_CBPRINTF_FP_SUPPORT=y # Floating point support
CONFIG_NEWLIB_LIBC=y # Add'l floating point support
CONFIG_NEWLIB_LIBC_FLOAT_PRINTF=y

# Enable heap for k_malloc/k_free
CONFIG_HEAP_MEM_POOL_SIZE=1024

# Enable FPU for eekf thread
CONFIG_FPU=y
CONFIG_FPU_SHARING=y

# ADC ADS1220 Driver enable
CONFIG_SPI=y
CONFIG_GPIO=y
CONFIG_ADC=y
# CONFIG_ADC_LOG_LEVEL_DBG=y

# Enable analog axis hires input for ADS1220
CONFIG_INPUT=y
# CONFIG_INPUT_LOG_LEVEL_DBG=y
CONFIG_INPUT_ANALOG_AXIS_HIRES=y

# Bluetooth-LE configuration
CONFIG_BT=y
CONFIG_BT_PERIPHERAL=y
CONFIG_BT_DEVICE_NAME="ME-507 Power Meter"
CONFIG_BT_DEVICE_APPEARANCE=832
CONFIG_BT_MAX_CONN=1
CONFIG_BT_EXT_ADV=y

# Thread startup synchronization
CONFIG_EVENTS=y

## TESTING NEW RTT CONFIGURATION FROM CHAT. Commented lines are already written above
# Logging core
# CONFIG_LOG=y
CONFIG_LOG_MODE_DEFERRED=y
CONFIG_LOG_PROCESS_THREAD=y
CONFIG_LOG_PROCESS_TRIGGER_THRESHOLD=1
CONFIG_LOG_BUFFER_SIZE=8192
# CONFIG_LOG_STRDUP_BUF_COUNT=8
# CONFIG_LOG_STRDUP_MAX_STRING=128

# Give the logging thread more room
CONFIG_LOG_PROCESS_THREAD_STACK_SIZE=2048
# CONFIG_LOG_PROCESS_THREAD_PRIORITY=0

# RTT backend
# CONFIG_USE_SEGGER_RTT=y
# CONFIG_LOG_BACKEND_RTT=y
CONFIG_LOG_BACKEND_RTT_MODE_BLOCK=y

# Bigger RTT transport buffers
CONFIG_SEGGER_RTT_BUFFER_SIZE_UP=8192
CONFIG_SEGGER_RTT_PRINTF_BUFFER_SIZE=256

# Console over RTT, if you want console/printk too
# CONFIG_CONSOLE=y
# CONFIG_RTT_CONSOLE=y
# CONFIG_UART_CONSOLE=n

## THREAD DEBUGGING CONFIGURATION
# Thread names are useful in reports
CONFIG_THREAD_NAME=y

# Stack/thread visibility
CONFIG_THREAD_MONITOR=y
CONFIG_INIT_STACKS=y
CONFIG_THREAD_STACK_INFO=y
CONFIG_THREAD_ANALYZER=y

# Runtime CPU timing stats
CONFIG_THREAD_RUNTIME_STATS=y
CONFIG_THREAD_RUNTIME_STATS_USE_TIMING_FUNCTIONS=y

# Optional: periodic analyzer output
CONFIG_THREAD_ANALYZER_AUTO=y
CONFIG_THREAD_ANALYZER_AUTO_INTERVAL=5